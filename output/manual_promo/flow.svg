    <text x="800" y="88" text-anchor="middle" class="t1">r0crawl_skills 的工作流：把逆向从玄学拉回工程</text><text x="800" y="136" text-anchor="middle" class="t2">每一步都留证据、留中间产物、留验证路径，不靠拍脑袋</text><rect x="90" y="220" width="280" height="430" rx="24" ry="24" fill="#111a33" stroke="#27345f" stroke-width="2" filter="url(#shadow)"/><circle cx="230" cy="300" r="54" fill="#2f7dff"/><text x="230" y="318" text-anchor="middle" font-size="44" font-weight="900" fill="#ffffff">1</text><text x="230" y="340" text-anchor="middle" font-size="28" font-weight="900" fill="#ffffff">四问启动</text><text x="230" y="390" text-anchor="middle" font-size="19" fill="#c6d5ff">分析什么 / 动作是什么 / 现有材料是什么 / 结果想要什么</text><rect x="470" y="220" width="280" height="430" rx="24" ry="24" fill="#111a33" stroke="#27345f" stroke-width="2" filter="url(#shadow)"/><circle cx="610" cy="300" r="54" fill="#19c37d"/><text x="610" y="318" text-anchor="middle" font-size="44" font-weight="900" fill="#ffffff">2</text><text x="610" y="340" text-anchor="middle" font-size="28" font-weight="900" fill="#ffffff">建案采证</text><text x="610" y="390" text-anchor="middle" font-size="19" fill="#c6d5ff">case、timeline、raw/</text><text x="610" y="420" text-anchor="middle" font-size="19" fill="#c6d5ff">derived、hash、manif</text><text x="610" y="450" text-anchor="middle" font-size="19" fill="#c6d5ff">est 先立住</text><rect x="850" y="220" width="280" height="430" rx="24" ry="24" fill="#111a33" stroke="#27345f" stroke-width="2" filter="url(#shadow)"/><circle cx="990" cy="300" r="54" fill="#ff9f1a"/><text x="990" y="318" text-anchor="middle" font-size="44" font-weight="900" fill="#ffffff">3</text><text x="990" y="340" text-anchor="middle" font-size="28" font-weight="900" fill="#ffffff">模块路由</text><text x="990" y="390" text-anchor="middle" font-size="19" fill="#c6d5ff">按目标匹配最小模块集，而不是盲目全量加载</text><rect x="1230" y="220" width="280" height="430" rx="24" ry="24" fill="#111a33" stroke="#27345f" stroke-width="2" filter="url(#shadow)"/><circle cx="1370" cy="300" r="54" fill="#8b5cf6"/><text x="1370" y="318" text-anchor="middle" font-size="44" font-weight="900" fill="#ffffff">4</text><text x="1370" y="340" text-anchor="middle" font-size="28" font-weight="900" fill="#ffffff">复现交付</text><text x="1370" y="390" text-anchor="middle" font-size="19" fill="#c6d5ff">parity、fixture、rep</text><text x="1370" y="420" text-anchor="middle" font-size="19" fill="#c6d5ff">ort、next action 一起</text><text x="1370" y="450" text-anchor="middle" font-size="19" fill="#c6d5ff">收口</text><line x1="370" y1="435" x2="470" y2="435" stroke="#4b6faf" stroke-width="6" stroke-linecap="round"/><polygon points="458,425 480,435 458,445" fill="#4b6faf"/><line x1="750" y1="435" x2="850" y2="435" stroke="#4b6faf" stroke-width="6" stroke-linecap="round"/><polygon points="838,425 860,435 838,445" fill="#4b6faf"/><line x1="1130" y1="435" x2="1230" y2="435" stroke="#4b6faf" stroke-width="6" stroke-linecap="round"/><polygon points="1218,425 1240,435 1218,445" fill="#4b6faf"/><rect x="70" y="700" width="1460" height="300" rx="24" ry="24" fill="#0f1730" stroke="#31456f" stroke-width="2" filter="url(#shadow)"/><text x="100" y="758" font-size="28" font-weight="900" fill="#ffffff">随身工具箱</text><rect x="100" y="800" width="170" height="40" rx="999" ry="999" fill="#12213e" stroke="#355082" stroke-width="1.5"/><text x="185.0" y="826.0" text-anchor="middle" font-size="16" fill="#dfe8ff" font-weight="700" font-family="Microsoft YaHei">init_case.py</text><rect x="284" y="800" width="210" height="40" rx="999" ry="999" fill="#12213e" stroke="#355082" stroke-width="1.5"/><text x="389.0" y="826.0" text-anchor="middle" font-size="16" fill="#dfe8ff" font-weight="700" font-family="Microsoft YaHei">module_router.py</text><rect x="508" y="800" width="210" height="40" rx="999" ry="999" fill="#12213e" stroke="#355082" stroke-width="1.5"/><text x="613.0" y="826.0" text-anchor="middle" font-size="16" fill="#dfe8ff" font-weight="700" font-family="Microsoft YaHei">hash_artifact.py</text><rect x="732" y="8