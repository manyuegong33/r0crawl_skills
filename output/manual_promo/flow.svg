chor="middle" font-size="16" fill="#dfe8ff" font-weight="700" font-family="Microsoft YaHei">frida_observe_template.js</text><rect x="1220" y="854" width="210" height="40" rx="999" ry="999" fill="#12213e" stroke="#355082" stroke-width="1.5"/><text x="1325.0" y="880.0" text-anchor="middle" font-size="16" fill="#dfe8ff" font-weight="700" font-family="Microsoft YaHei">ida_export_template.py</text><text x="100" y="980" font-size="26" font-weight="900" fill="#ffffff">总结：</text><text x="220" y="980" font-size="24" fill="#c6d5ff">把经验压成流程，把流程压成模块，把模块压成可复现的结果。</text>
